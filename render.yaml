# NOTE: Do not commit real credentials/secrets to this repo.
# Set secrets (DATABASE_URL, JWT_SECRET, SUPABASE_* etc.) in Render's dashboard.
services:
  - type: web
    name: successbridge-api
    runtime: node
    region: singapore
    plan: free
    repo: https://github.com/TolesaTesfaye/SuccessBridge
    branch: main
    rootDir: Server
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: REPLACE_ME
      - key: JWT_SECRET
        value: REPLACE_ME
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: REPLACE_ME
      - key: SUPABASE_ANON_KEY
        value: REPLACE_ME
      - key: SUPABASE_SERVICE_KEY
        value: REPLACE_ME
      - key: FRONTEND_URL
        value: https://successbridge.vercel.app
